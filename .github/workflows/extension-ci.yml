name: Extension CI

on:
  push:
    paths:
      - "safegraph-ai-vscode/**"
      - "scripts/**"
      - ".github/workflows/extension-ci.yml"
  pull_request:
    paths:
      - "safegraph-ai-vscode/**"
      - "scripts/**"

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: safegraph-ai-vscode

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: safegraph-ai-vscode/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - run: npm run package

      - name: Verify versions
        working-directory: .
        run: node scripts/release.js --check
