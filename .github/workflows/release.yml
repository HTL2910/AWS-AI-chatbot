name: Release VSIX

# Builds the extension and attaches the .vsix to the GitHub Release for a tag.
# Triggers on tags like 0.20.0 or v0.20.0, or manually for an existing tag
# (Actions → Release VSIX → Run workflow → enter the tag).
on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the .vsix to (e.g. 0.20.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    defaults:
      run:
        working-directory: safegraph-ai-vscode

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: "safegraph-ai-vscode/.nvmrc"
          cache: npm
          cache-dependency-path: safegraph-ai-vscode/package-lock.json

      - run: npm ci
      - run: npm run test:ci
      - run: npm run package

      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG#v}" != "${version}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${version}"
            exit 1
          fi

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: safegraph-ai-vscode/*.vsix
          fail_on_unmatched_files: true
