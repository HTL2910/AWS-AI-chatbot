name: Restore overwritten files

on:
  push:
    paths:
      - .github/workflows/restore-overwritten-files.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/openai-compatible-providers-29bb
          fetch-depth: 0

      - name: Restore files from the last good commit
        run: |
          set -euo pipefail
          GOOD=f60ce1f6f1d258afd278b5c8475157d3c8f613a4
          git checkout "$GOOD" -- \
            safegraph-ai-vscode/media/main.js \
            safegraph-ai-vscode/src/chat/ChatViewProvider.ts \
            safegraph-ai-vscode/package-lock.json
          python3 - << 'PY'
          from pathlib import Path
          path = Path("safegraph-ai-vscode/package-lock.json")
          text = path.read_text()
          updated = text.replace('"version": "0.20.0"', '"version": "0.20.5"', 2)
          if updated == text:
              raise SystemExit("expected 0.20.0 version fields in the lockfile")
          path.write_text(updated)
          PY
          rm -f .github/workflows/restore-overwritten-files.yml
          git config user.name "safegraph-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore files overwritten during upload and set lockfile to 0.20.5"
          git push origin HEAD:cursor/openai-compatible-providers-29bb
